<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Toko Digital</h1>
        <nav>
            <a href="#products">Produk</a>
            <a href="#cart">Keranjang</a>
            <span id="auth-section">
                <a href="#" id="login-link">Login</a>
                <a href="#" id="register-link">Register</a>
            </span>
            <span id="user-section" style="display:none;">
                <span id="username-display"></span>
                <a href="#" id="logout-link">Logout</a>
            </span>
        </nav>
    </header>
    <main>
        <section id="auth-modal" style="display:none;">
            <div class="modal-content">
                <h2 id="auth-title">Login</h2>
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <input type="email" id="email" placeholder="Email (optional)" style="display:none;">
                <button id="auth-submit">Submit</button>
                <button id="auth-cancel">Cancel</button>
                <p id="auth-error"></p>
            </div>
        </section>
        <section id="products">
            <h2>Produk</h2>
            <div id="product-list"></div>
        </section>
        <section id="cart">
            <h2>Keranjang</h2>
            <div id="cart-items"></div>
            <button id="checkout-btn">Bayar Sekarang</button>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
